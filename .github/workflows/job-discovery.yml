name: Job Discovery Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * *"
      timezone: "America/New_York"
    - cron: "23 12 * * *"
      timezone: "America/New_York"
    - cron: "23 16 * * *"
      timezone: "America/New_York"
    - cron: "23 20 * * *"
      timezone: "America/New_York"

permissions:
  contents: read
  actions: read

concurrency:
  group: job-discovery-sync
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Schedule heartbeat
        shell: bash
        run: |
          echo "Job Discovery Sync started."
          echo "Event: ${{ github.event_name }}"
          echo "Scheduled expression: ${{ github.event.schedule || 'manual' }}"
          echo "UTC: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Eastern: $(TZ=America/New_York date '+%Y-%m-%d %I:%M:%S %p %Z')"

      - name: Check out job tracker
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4

      - name: Validate Python discovery files
        run: |
          python -m py_compile scripts/discover_jobs.py scripts/import_openjobs.py
          python - <<'PY'
          import ast
          from pathlib import Path
          for p in [Path("scripts/discover_jobs.py"), Path("scripts/import_openjobs.py")]:
              ast.parse(p.read_text(encoding="utf-8"))
              print(f"AST OK: {p}")
          PY

      - name: Clone multi-ATS harvester
        run: |
          rm -rf _vendor/openjobs
          git clone --depth 1 https://github.com/outscal/OpenJobs.git _vendor/openjobs

      - name: Restore expanded ATS route map
        id: restore-routes
        uses: actions/cache/restore@v4
        with:
          path: _vendor/openjobs/data/companies_v2.json
          key: openjobs-ats-routes-${{ github.run_id }}
          restore-keys: |
            openjobs-ats-routes-

      - name: Report ATS route source
        run: |
          if [ "${{ steps.restore-routes.outputs.cache-matched-key }}" != "" ]; then
            echo "Using expanded ATS route map from cache:"
            echo "${{ steps.restore-routes.outputs.cache-matched-key }}"
          else
            echo "No expanded route cache found yet; using upstream OpenJobs routes."
          fi
          test -f _vendor/openjobs/data/companies_v2.json

      - name: Prepare multi-ATS harvester
        run: |
          cd _vendor/openjobs
          npm install
          test -f templates/portals.example.yml
          cp templates/portals.example.yml portals.yml
          test -f portals.yml
          echo "OpenJobs configuration prepared."

      - name: Harvest live jobs across supported ATS platforms
        run: |
          cd _vendor/openjobs
          node harvest.mjs --no-filter
          echo ""
          echo "Harvest output:"
          ls -lah output || true
          echo ""
          echo "CSV row counts:"
          found=0
          for f in output/jobs-*.csv; do
            [ -e "$f" ] || continue
            found=1
            rows=$(($(wc -l < "$f") - 1))
            echo "$(basename "$f"): $rows jobs"
          done
          if [ "$found" -eq 0 ]; then
            echo "ERROR: OpenJobs produced no jobs CSV."
            exit 1
          fi

      - name: Import multi-ATS jobs into Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
        run: |
          CSV="$(ls -1t _vendor/openjobs/output/jobs-*.csv 2>/dev/null | head -1)"
          if [ -z "$CSV" ]; then
            echo "ERROR: Multi-ATS harvester produced no jobs CSV."
            exit 1
          fi
          echo "Importing: $CSV"
          python scripts/import_openjobs.py "$CSV"

      - name: Run supplemental direct discovery
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
        run: python scripts/discover_jobs.py

      - name: Final heartbeat
        if: always()
        shell: bash
        run: |
          echo "Job Discovery Sync finished with job status: ${{ job.status }}"
          echo "Eastern finish: $(TZ=America/New_York date '+%Y-%m-%d %I:%M:%S %p %Z')"
