name: Job Discovery Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "15 12,16,20,0 * * *"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out job tracker
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4

      - name: Validate Python discovery files
        run: |
          python -m py_compile scripts/discover_jobs.py scripts/import_openjobs.py
          python - <<'PY'
          import ast
          from pathlib import Path
          for p in [Path("scripts/discover_jobs.py"), Path("scripts/import_openjobs.py")]:
              ast.parse(p.read_text(encoding="utf-8"))
              print(f"AST OK: {p}")
          PY

      - name: Clone multi-ATS harvester
        run: |
          rm -rf _vendor/openjobs
          git clone --depth 1 https://github.com/outscal/OpenJobs.git _vendor/openjobs
          cd _vendor/openjobs
          npm install

      - name: Harvest live jobs across supported ATS platforms
        run: |
          cd _vendor/openjobs
          rm -f data/harvest-history.tsv
          node harvest.mjs --no-filter
          echo ""
          echo "Harvest output:"
          ls -lah output || true
          echo ""
          echo "CSV row counts:"
          for f in output/jobs-*.csv; do
            [ -e "$f" ] || continue
            echo "$(basename "$f"): $(($(wc -l < "$f") - 1)) jobs"
          done

      - name: Import multi-ATS jobs into Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
        run: |
          CSV="$(ls -1t _vendor/openjobs/output/jobs-*.csv 2>/dev/null | head -1)"
          if [ -z "$CSV" ]; then
            echo "ERROR: Multi-ATS harvester produced no jobs CSV."
            exit 1
          fi
          echo "Importing: $CSV"
          python scripts/import_openjobs.py "$CSV"

      - name: Run supplemental direct discovery
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
        run: python scripts/discover_jobs.py
